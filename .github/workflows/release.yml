name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libvulkan-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb package
        run: cargo deb --target ${{ matrix.target }} --no-build

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rust_top dist/rust_top-linux-amd64
          cp target/${{ matrix.target }}/debian/*.deb dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-x86_64-pc-windows-msvc-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target\x86_64-pc-windows-msvc\release\rust_top.exe dist\rust_top-windows-x86_64.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/

  build-macos:
    runs-on: macos-13   # Intel — compatible with Hackintosh x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-x86_64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Assemble .app bundle
        run: |
          APP="$GITHUB_WORKSPACE/RustTop.app"
          CONTENTS="$APP/Contents"
          mkdir -p "$CONTENTS/MacOS" "$CONTENTS/Resources"

          cp target/release/rust_top "$CONTENTS/MacOS/rust_top"

          # Build .icns from master PNG
          ICONSET=$(mktemp -d)/rust_top.iconset
          mkdir -p "$ICONSET"
          SRC="$GITHUB_WORKSPACE/assets/icons/rust_top_1024.png"
          sips -z 16   16   "$SRC" --out "$ICONSET/icon_16x16.png"      >/dev/null
          sips -z 32   32   "$SRC" --out "$ICONSET/icon_16x16@2x.png"   >/dev/null
          sips -z 32   32   "$SRC" --out "$ICONSET/icon_32x32.png"      >/dev/null
          sips -z 64   64   "$SRC" --out "$ICONSET/icon_32x32@2x.png"   >/dev/null
          sips -z 128  128  "$SRC" --out "$ICONSET/icon_128x128.png"    >/dev/null
          sips -z 256  256  "$SRC" --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256  256  "$SRC" --out "$ICONSET/icon_256x256.png"    >/dev/null
          sips -z 512  512  "$SRC" --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512  512  "$SRC" --out "$ICONSET/icon_512x512.png"    >/dev/null
          cp "$SRC"                     "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" --output "$CONTENTS/Resources/rust_top.icns"

          # Write Info.plist
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          cat > "$CONTENTS/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
              "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key><string>io.github.sudoshi.RustTop</string>
              <key>CFBundleName</key><string>RustTop</string>
              <key>CFBundleDisplayName</key><string>RustTop</string>
              <key>CFBundleExecutable</key><string>rust_top</string>
              <key>CFBundleIconFile</key><string>rust_top</string>
              <key>CFBundleVersion</key><string>${VERSION}</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST

      - name: Zip .app bundle
        run: |
          mkdir -p dist
          cd "$GITHUB_WORKSPACE"
          zip -r dist/RustTop-macos-intel.zip RustTop.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: dist/

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
