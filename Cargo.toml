[package]
name = "rust_top"
version = "0.2.1"
edition = "2021"
description = "A beautiful, cross-platform system monitor built in Rust"
license = "MIT"
repository = "https://github.com/sudoshi/RustTop"
homepage = "https://github.com/sudoshi/RustTop"
readme = "README.md"
keywords = ["system-monitor", "gpu", "top", "htop", "iced"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
# Command-line interface
clap = { version = "4", features = ["derive"] }

# GUI framework - GPU-accelerated, cross-platform
iced = { version = "0.13", features = ["canvas", "tokio", "advanced", "image"] }
iced_winit = { version = "0.13", features = ["wayland"] }

# Configuration
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# System metrics - cross-platform (Linux, macOS, Windows)
sysinfo = "0.35"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Time handling
chrono = "0.4"

# Color manipulation
palette = "0.7"

# NVIDIA GPU monitoring (dynamically loads libnvidia-ml at runtime)
nvml-wrapper = "0.10"

[package.metadata.deb]
maintainer = "RustTop Contributors"
copyright = "2026, RustTop Contributors"
extended-description = """\
RustTop is a beautiful, GPU-accelerated system monitor inspired by btop. \
It displays CPU usage with per-core bars and activity dots, memory, swap, \
disk and network rates, AMD/NVIDIA/Intel GPU baselines, battery and sensor \
panels, sustained threshold alerts, JSON/CSV exports, incident bundles, \
a token-protected local API, and a sortable/filterable process table. \
Built with Rust and iced for smooth 60fps rendering."""
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/rust_top", "usr/bin/", "755"],
    ["assets/rust_top.desktop", "usr/share/applications/", "644"],
    ["assets/icons/rust_top.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["assets/icons/rust_top_48.png", "usr/share/icons/hicolor/48x48/apps/rust_top.png", "644"],
    ["assets/icons/rust_top_128.png", "usr/share/icons/hicolor/128x128/apps/rust_top.png", "644"],
    ["assets/icons/rust_top.png", "usr/share/icons/hicolor/256x256/apps/rust_top.png", "644"],
]
maintainer-scripts = "debian/"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
