<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22232e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#78def0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0c878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f06478;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="graph" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#78f098;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#78def0;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="8" y="8" width="240" height="240" rx="40" ry="40" fill="url(#bg)" stroke="#363748" stroke-width="2"/>
  <!-- Gauge arc -->
  <path d="M 68 168 A 60 60 0 1 1 188 168" fill="none" stroke="url(#arc)" stroke-width="10" stroke-linecap="round"/>
  <!-- Gauge track -->
  <path d="M 68 168 A 60 60 0 1 1 188 168" fill="none" stroke="#363748" stroke-width="10" stroke-linecap="round" opacity="0.3"/>
  <!-- Graph line -->
  <polyline points="40,200 70,185 95,195 120,170 145,180 170,155 195,165 220,140" fill="none" stroke="#78def0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Graph fill -->
  <polygon points="40,200 70,185 95,195 120,170 145,180 170,155 195,165 220,140 220,220 40,220" fill="url(#graph)" opacity="0.4"/>
  <!-- Center text -->
  <text x="128" y="148" text-anchor="middle" fill="#e6e8f2" font-family="monospace" font-weight="bold" font-size="28">RT</text>
  <!-- Dot indicators -->
  <circle cx="80" cy="210" r="4" fill="#78f098" opacity="0.9"/>
  <circle cx="96" cy="208" r="4" fill="#78f098" opacity="0.7"/>
  <circle cx="112" cy="212" r="4" fill="#f0c878" opacity="0.8"/>
  <circle cx="128" cy="206" r="4" fill="#f0c878" opacity="0.9"/>
  <circle cx="144" cy="210" r="4" fill="#f06478" opacity="0.7"/>
  <circle cx="160" cy="204" r="4" fill="#f06478" opacity="0.9"/>
  <circle cx="176" cy="208" r="4" fill="#cc78f0" opacity="0.8"/>
</svg>
